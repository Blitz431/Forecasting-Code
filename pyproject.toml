[project]
name = "autostockanalyzer"
version = "0.1.0"
description = "Stock forecasting and automated trading tool with ML, technical analysis, and Alpaca integration"
requires-python = ">=3.11"
dependencies = [
    # Data
    "yfinance>=0.2.36",
    "fredapi>=0.5.2",
    "pyarrow>=15.0.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "openpyxl>=3.1.0",

    # Forecasting
    "statsmodels>=0.14.0",
    "scikit-learn>=1.4.0",

    # ML
    "xgboost>=2.0.0",
    "lightgbm>=4.3.0",
    "torch>=2.2.0",
    "optuna>=3.5.0",
    "shap>=0.45.0",

    # Technical Analysis
    "ta>=0.11.0",

    # Trading
    "alpaca-trade-api>=3.2.0",

    # News & Scraping
    "requests>=2.31.0",
    "feedparser>=6.0.0",
    "beautifulsoup4>=4.12.0",
    "transformers>=4.40.0",
    "sentencepiece>=0.2.0",

    # Alerts
    "discord-webhook>=1.3.0",

    # Reports
    "fpdf2>=2.7.0",
    "python-docx>=1.1.0",

    # UI
    "streamlit>=1.31.0",
    "plotly>=5.18.0",

    # Config
    "python-dotenv>=1.0.0",
    "pydantic-settings>=2.1.0",
    "pydantic>=2.6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.2.0",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
